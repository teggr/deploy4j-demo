<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${application.name} + ' - File Explorer'">File Explorer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background-color: #f6f8fa;
            border-bottom: 1px solid #d0d7de;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }
        
        .back-link {
            color: #0969da;
            text-decoration: none;
            font-size: 14px;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .sidebar {
            width: 300px;
            border-right: 1px solid #d0d7de;
            overflow-y: auto;
            background-color: #f6f8fa;
        }
        
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .toolbar {
            background-color: #f6f8fa;
            border-bottom: 1px solid #d0d7de;
            padding: 8px 16px;
            min-height: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .toolbar-title {
            font-size: 14px;
            color: #57606a;
            flex: 1;
        }
        
        .content-pane {
            flex: 1;
            overflow: auto;
            padding: 16px;
            background-color: #ffffff;
        }
        
        .tree-node {
            cursor: pointer;
            padding: 4px 8px;
            user-select: none;
        }
        
        .tree-node:hover {
            background-color: #e7edf4;
        }
        
        .tree-node.selected {
            background-color: #ddf4ff;
        }
        
        .tree-node-content {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .tree-icon {
            font-size: 16px;
            width: 16px;
        }
        
        .tree-label {
            font-size: 14px;
        }
        
        .tree-children {
            margin-left: 20px;
        }
        
        .tree-node.collapsed > .tree-children {
            display: none;
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #57606a;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        pre {
            margin: 0;
        }
        
        code {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 12px;
            line-height: 1.5;
        }
        
        .error-message {
            color: #d1242f;
            padding: 16px;
            background-color: #fff1f0;
            border: 1px solid #ffcccb;
            border-radius: 6px;
        }
        
        .loading {
            padding: 16px;
            color: #57606a;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 th:text="${application.name} + ' - File Explorer'">Repository Explorer</h1>
        <a href="/" class="back-link">← Back to Applications</a>
    </div>
    
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="loading">Loading file tree...</div>
        </div>
        
        <div class="content-area">
            <div class="toolbar">
                <span class="toolbar-title" id="currentFile">Select a file to view its contents</span>
            </div>
            <div class="content-pane" id="contentPane">
                <div class="empty-state">
                    <div class="empty-state-icon">📄</div>
                    <p>Select a file from the tree to view its contents</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script th:inline="javascript">
        const applicationId = /*[[${application.id}]]*/ 0;
        let currentTree = null;
        
        // Load file tree on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadFileTree();
        });
        
        function loadFileTree() {
            fetch(`/explore/api/files/${applicationId}`)
                .then(response => response.json())
                .then(data => {
                    if (typeof data === 'object' && data.name) {
                        currentTree = data;
                        renderFileTree(data);
                    } else {
                        showError('Repository path not configured or invalid');
                    }
                })
                .catch(error => {
                    showError('Error loading file tree: ' + error.message);
                });
        }
        
        function renderFileTree(tree) {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';
            const rootNode = createTreeNode(tree);
            sidebar.appendChild(rootNode);
            // Expand root by default
            rootNode.classList.remove('collapsed');
        }
        
        function createTreeNode(node) {
            const div = document.createElement('div');
            div.className = 'tree-node' + (node.type === 'directory' ? ' collapsed' : '');
            
            const content = document.createElement('div');
            content.className = 'tree-node-content';
            
            const icon = document.createElement('span');
            icon.className = 'tree-icon';
            icon.textContent = node.type === 'directory' ? '📁' : '📄';
            
            const label = document.createElement('span');
            label.className = 'tree-label';
            label.textContent = node.name;
            
            content.appendChild(icon);
            content.appendChild(label);
            div.appendChild(content);
            
            if (node.type === 'directory' && node.children && node.children.length > 0) {
                const children = document.createElement('div');
                children.className = 'tree-children';
                
                node.children.forEach(child => {
                    children.appendChild(createTreeNode(child));
                });
                
                div.appendChild(children);
                
                // Toggle directory on click
                content.addEventListener('click', function(e) {
                    e.stopPropagation();
                    div.classList.toggle('collapsed');
                    icon.textContent = div.classList.contains('collapsed') ? '📁' : '📂';
                });
            } else if (node.type === 'file') {
                // Load file content on click
                content.addEventListener('click', function(e) {
                    e.stopPropagation();
                    // Remove selection from all nodes
                    document.querySelectorAll('.tree-node').forEach(n => n.classList.remove('selected'));
                    div.classList.add('selected');
                    loadFileContent(node.path);
                });
            }
            
            return div;
        }
        
        function loadFileContent(path) {
            document.getElementById('currentFile').textContent = 'Loading: ' + path;
            document.getElementById('contentPane').innerHTML = '<div class="loading">Loading file content...</div>';
            
            fetch(`/explore/api/file-content/${applicationId}?path=${encodeURIComponent(path)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.content !== undefined) {
                        displayFileContent(data.path, data.content);
                    } else {
                        showError('Error loading file: ' + JSON.stringify(data));
                    }
                })
                .catch(error => {
                    showError('Error loading file content: ' + error.message);
                });
        }
        
        function displayFileContent(path, content) {
            document.getElementById('currentFile').textContent = path;
            const contentPane = document.getElementById('contentPane');
            
            // Detect language from file extension
            const extension = path.split('.').pop().toLowerCase();
            const languageMap = {
                'js': 'javascript',
                'java': 'java',
                'py': 'python',
                'html': 'html',
                'css': 'css',
                'xml': 'xml',
                'json': 'json',
                'yaml': 'yaml',
                'yml': 'yaml',
                'md': 'markdown',
                'sh': 'bash',
                'sql': 'sql',
                'ts': 'typescript',
                'tsx': 'typescript',
                'jsx': 'javascript'
            };
            
            const language = languageMap[extension] || 'plaintext';
            
            contentPane.innerHTML = `<pre><code class="language-${language}">${escapeHtml(content)}</code></pre>`;
            
            // Apply syntax highlighting
            hljs.highlightAll();
        }
        
        function showError(message) {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = `<div class="error-message">${escapeHtml(message)}</div>`;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
